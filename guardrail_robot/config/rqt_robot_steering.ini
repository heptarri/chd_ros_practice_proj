; rqt_robot_steering configuration used by teleop.launch.py.
;
; rqt remembers the last topic, the "stamped" checkbox and the slider limits in
; ~/.config/ros.org/rqt_gui.ini, so a leftover setting from another project can
; silently publish to the wrong topic (or publish geometry_msgs/TwistStamped
; instead of geometry_msgs/Twist).  The guardrail robot expects an unstamped
; Twist on /cmd_vel, so these values are pre-seeded here.  teleop.launch.py
; runs rqt_robot_steering with XDG_CONFIG_HOME pointing at a copy of this file.
[General]
current-perspective=@rqt_robot_steering__RobotSteering
perspectives=@rqt_robot_steering__RobotSteering

[perspective]
%40rqt_robot_steering__RobotSteering\pluginmanager\plugin__rqt_robot_steering__RobotSteering__0\plugin\stamped=false
%40rqt_robot_steering__RobotSteering\pluginmanager\plugin__rqt_robot_steering__RobotSteering__0\plugin\topic=/cmd_vel
%40rqt_robot_steering__RobotSteering\pluginmanager\plugin__rqt_robot_steering__RobotSteering__0\plugin\vx_max=10
%40rqt_robot_steering__RobotSteering\pluginmanager\plugin__rqt_robot_steering__RobotSteering__0\plugin\vx_min=-4
%40rqt_robot_steering__RobotSteering\pluginmanager\plugin__rqt_robot_steering__RobotSteering__0\plugin\vw_max=2
%40rqt_robot_steering__RobotSteering\pluginmanager\plugin__rqt_robot_steering__RobotSteering__0\plugin\vw_min=-2
